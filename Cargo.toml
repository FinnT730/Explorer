[workspace]
members = ["crates/explorer-core", "crates/explorer-thumbs", "crates/explorer-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FinnT730/Explorer"
rust-version = "1.82"

[workspace.dependencies]
explorer-core = { path = "crates/explorer-core" }
explorer-thumbs = { path = "crates/explorer-thumbs" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
egui = "0.36"
egui_extras = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
humansize = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "dds", "hdr", "qoi", "exr", "ff"] }
notify = "8"
open = "5"
parking_lot = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }
trash = "5"
walkdir = "2"
window-vibrancy = "0.8"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
