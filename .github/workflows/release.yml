name: Release

# Tag a commit to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Or run this workflow by hand to produce the binaries without publishing
# anything (leave the tag input empty).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the release under (leave empty to only build)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # egui links against the X11/Wayland client libraries at build time.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev libxi-dev libx11-dev pkg-config

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin explorer

      - name: Stage the archive contents
        shell: bash
        run: |
          staging="explorer-${{ matrix.target }}"
          mkdir -p "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/explorer.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/explorer" "$staging/"
          fi
          cp README.md "$staging/"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar czf "$STAGING.tar.gz" "$STAGING"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "$env:STAGING" -DestinationPath "$env:STAGING.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: explorer-${{ matrix.target }}
          path: explorer-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    # Only publish for a tag: either a tag push, or a manual run that named one.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * | tee SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Re-running a release replaces its assets rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "Explorer $TAG" \
              --generate-notes
          fi
